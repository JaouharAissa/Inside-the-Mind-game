<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Mind Healer</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #0a0e27;
            color: white;
        }

        #status {
            padding: 20px;
            background: rgba(99, 102, 241, 0.2);
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .success {
            color: #10b981;
        }

        .error {
            color: #ef4444;
        }

        button {
            padding: 10px 20px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #818cf8;
        }

        canvas {
            border: 2px solid #6366f1;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <h1>🔧 Test de Diagnostic - Mind Healer</h1>

    <div id="status">
        <h2>État du système :</h2>
        <div id="checks"></div>
    </div>

    <button onclick="startTest()">Lancer le test 3D</button>

    <canvas id="test-canvas" width="800" height="600"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const checksDiv = document.getElementById('checks');

        function addCheck(message, isSuccess) {
            const p = document.createElement('p');
            p.className = isSuccess ? 'success' : 'error';
            p.textContent = (isSuccess ? '✅ ' : '❌ ') + message;
            checksDiv.appendChild(p);
        }

        // Check 1: Three.js loaded
        if (typeof THREE !== 'undefined') {
            addCheck('Three.js chargé avec succès (version r' + THREE.REVISION + ')', true);
        } else {
            addCheck('Erreur : Three.js n\'a pas pu être chargé', false);
        }

        // Check 2: Canvas available
        const canvas = document.getElementById('test-canvas');
        if (canvas) {
            addCheck('Canvas HTML5 disponible', true);
        } else {
            addCheck('Erreur : Canvas non trouvé', false);
        }

        // Check 3: WebGL support
        try {
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (gl) {
                addCheck('WebGL supporté par votre navigateur', true);
            } else {
                addCheck('Erreur : WebGL non supporté', false);
            }
        } catch (e) {
            addCheck('Erreur : Impossible de tester WebGL - ' + e.message, false);
        }

        function startTest() {
            if (typeof THREE === 'undefined') {
                alert('Three.js n\'est pas chargé. Vérifiez votre connexion Internet.');
                return;
            }

            try {
                // Create scene
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x1a1a3e);

                // Create camera
                const camera = new THREE.PerspectiveCamera(75, 800 / 600, 0.1, 1000);
                camera.position.z = 5;

                // Create renderer
                const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
                renderer.setSize(800, 600);

                // Add light
                const light = new THREE.PointLight(0xffffff, 1, 100);
                light.position.set(5, 5, 5);
                scene.add(light);

                const ambientLight = new THREE.AmbientLight(0x404040);
                scene.add(ambientLight);

                // Create a rotating cube
                const geometry = new THREE.BoxGeometry(2, 2, 2);
                const material = new THREE.MeshPhongMaterial({
                    color: 0x6366f1,
                    emissive: 0x4f46e5,
                    emissiveIntensity: 0.3
                });
                const cube = new THREE.Mesh(geometry, material);
                scene.add(cube);

                // Create a sphere
                const sphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);
                const sphereMaterial = new THREE.MeshPhongMaterial({
                    color: 0xa78bfa,
                    emissive: 0x8b5cf6,
                    emissiveIntensity: 0.5
                });
                const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
                sphere.position.x = -3;
                scene.add(sphere);

                // Animation loop
                function animate() {
                    requestAnimationFrame(animate);

                    cube.rotation.x += 0.01;
                    cube.rotation.y += 0.01;

                    sphere.position.y = Math.sin(Date.now() * 0.002) * 1.5;

                    renderer.render(scene, camera);
                }

                animate();
                addCheck('Test 3D lancé avec succès ! Vous devriez voir un cube qui tourne et une sphère qui flotte.', true);

            } catch (error) {
                addCheck('Erreur lors du test 3D : ' + error.message, false);
                console.error('Erreur complète:', error);
            }
        }

        // Auto-start test after 1 second
        setTimeout(() => {
            addCheck('Prêt pour le test ! Cliquez sur le bouton ci-dessus.', true);
        }, 1000);
    </script>
</body>

</html>
